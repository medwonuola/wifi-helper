[project]
name = "wifi-helper"
version = "0.2.0"
description = "Offline CLI and auto-heal watchdog for Huawei HiLink 4G/5G home internet (Airtel, MTN, Glo and others)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmed Arigbabu", email = "Medwonuola@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["huawei", "hilink", "5g", "lte", "cpe", "airtel", "mtn", "nigeria", "watchdog"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "dnspython>=2.8.0",
    "huawei-lte-api>=2.0.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "rich>=13.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/medwonuola/wifi-helper"
Issues = "https://github.com/medwonuola/wifi-helper/issues"

[project.scripts]
wifi = "wifi_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
